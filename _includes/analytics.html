{% if site.google_analytics != blank %}
<!-- Google Analytics (GA4), opt-out model. GA loads by default in production; a notice
     lets visitors opt out, which stops tracking and is remembered across visits. -->
<div class="cookie-consent" id="cookie-consent" role="region" aria-label="Analytics notice" hidden>
  <p class="cookie-consent__text">
    We use <strong>Google Analytics</strong> to judge the quality of this site and make
    sure it meets your needs. That is the <strong>only</strong> thing this data is ever
    used for — nothing else. You can opt out anytime.
  </p>
  <div class="cookie-consent__actions">
    <button type="button" class="cookie-btn cookie-btn--decline" data-consent="denied">Opt out</button>
    <button type="button" class="cookie-btn cookie-btn--accept" data-consent="granted">Got it</button>
  </div>
</div>
<script>
(function () {
  var KEY  = 'ga-consent';
  var ID   = '{{ site.google_analytics }}';
  var PROD = {% if jekyll.environment == 'production' %}true{% else %}false{% endif %};
  var banner = document.getElementById('cookie-consent');

  function loadGA() {
    if (!PROD || !ID || window.__gaLoaded) return;
    window.__gaLoaded = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', ID);
  }

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}

  if (saved === 'denied') {
    window['ga-disable-' + ID] = true;     // opted-out visitor: never load, never track
  } else {
    loadGA();                              // collect by default
    if (saved !== 'granted' && banner) banner.hidden = false;  // first visit — show the notice
  }

  function decide(choice) {
    try { localStorage.setItem(KEY, choice); } catch (e) {}
    if (banner) banner.hidden = true;
    if (choice === 'denied') window['ga-disable-' + ID] = true; // stop any further hits now
  }

  if (banner) {
    banner.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-consent]');
      if (btn) decide(btn.getAttribute('data-consent'));
    });
  }
})();
</script>
{% endif %}
