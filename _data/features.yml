# Feature grid — short, point-form. Scoped to what jheapo can honestly
# measure/do (instruments, not verdicts). Icons are still placeholders.
- icon: "∞"
  title: Built to scale
  body: Analyze a heap far larger than the machine's RAM — crack open your biggest production dump without provisioning a giant box to hold it.

# The knot icon here is a placeholder for a proper "entanglement" mark.
- icon: "➿"
  title: Entanglement
  body: "A new lens on retention: measure how entangled your objects are — a proxy for domain complexity."

- icon: "◱"
  title: Finds the waste
  body: Duplicate strings, underused collections, boxed numbers, empty arrays — the fat that quietly fills your heap.

- icon: "⚑"
  title: Leak suspects
  body: The biggest retainers in your heap, ranked — the first suspects to check when memory won't let go.

- icon: "❖"
  title: Object model complexity
  body: Put a number on how complex your object model really is — the sprawl and depth of the types filling your heap.

- icon: "✦"
  title: AI Assist
  body: An optional AI panel that answers plain-language questions about the analyzed heap. Enabled when a key is present.
