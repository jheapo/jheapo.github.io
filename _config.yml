# --- Site ---------------------------------------------------------------
title: JHeapo
tagline: Analyze Large Heaps
description: >-
  JHeapo is a streaming, out-of-core Java heap-dump analyzer. Find the memory
  waste that drives up latency, destabilizes GC pauses, and inflates your cloud
  bill — in heaps far larger than RAM.

# Absolute URL of the deployed site. Leave baseurl empty when served at the
# domain root; set it to "/jheapo" (etc.) if served from a subpath.
url: "https://jheapo.github.io"
baseurl: ""

# External links surfaced in the nav and footer.
docs_url: "#"          # docs live on a separate site; wire this up later
# Where "Request a demo" / "Contact" go. Swap for a dedicated address if desired.
contact_email: kirk.pepperdine@gmail.com

# JScrub download — GitHub latest release (always tracks the newest version).
jscrub_url: "https://github.com/jheapo/jscrub/releases/latest"
# GCSee download link. DUMMY placeholder — resolve later.
gcsee_url: "#"

author: Kirk Pepperdine

# Google Analytics 4 Measurement ID (looks like G-XXXXXXXXXX). Paste yours here
# once the GA4 web data stream exists. Leave empty to disable. The tag only loads
# in production (the deployed site), never on the local `jekyll serve` dev server.
google_analytics: "G-F35L5EV4LK"

# --- Build --------------------------------------------------------------
# No external theme gem — the layout is self-contained so this builds the same
# on plain Jekyll and on GitHub Pages.
markdown: kramdown
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
